name: R tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:   # allows manual trigger from GitHub UI or gh CLI

jobs:
  test:
    runs-on: self-hosted

    env:
      ## Path to the 1000 Genomes EUR reference panel on the server
      ## (without extension — .bed/.bim/.fam must exist at this path).
      ## Set this in the runner's environment or as a repo secret if preferred.
      COLOCKIT_REFPLINK: ${{ vars.COLOCKIT_REFPLINK }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache renv library
        uses: actions/cache@v4
        with:
          path: ~/.cache/R/renv
          key: renv-${{ hashFiles('renv.lock') }}
          restore-keys: renv-

      - name: Restore renv library
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/focal/latest"))
          if (!requireNamespace("renv", quietly = TRUE))
            install.packages("renv")
          ## pkgbuild on this server reports no compiler even though gcc works fine
          options(pkgbuild.has_compiler = TRUE)
          renv::restore(prompt = FALSE)

      - name: Run tests
        shell: Rscript {0}
        run: |
          options(pkgbuild.has_compiler = TRUE)
          pkgload::load_all(".", quiet = TRUE)
          results <- testthat::test_local(".", reporter = "progress")
          if (any(as.data.frame(results)$failed > 0))
            stop("One or more tests failed.")

      - name: R CMD check
        shell: bash
        run: |
          export PATH="/usr/local/bin:$PATH"
          ## Use the renv project library so R CMD check sees the correct package versions
          export R_LIBS="$(Rscript -e 'cat(renv::paths$library())')"
          R CMD build . --no-manual
          R CMD check --no-manual *_*.tar.gz
