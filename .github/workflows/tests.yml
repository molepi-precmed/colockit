name: R tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:   # allows manual trigger from GitHub UI or gh CLI

jobs:
  test:
    runs-on: self-hosted

    env:
      ## Path to the 1000 Genomes EUR reference panel on the server
      ## (without extension — .bed/.bim/.fam must exist at this path).
      ## Set this in the runner's environment or as a repo secret if preferred.
      COLOCKIT_REFPLINK: ${{ vars.COLOCKIT_REFPLINK }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install/update R package dependencies
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))

          ## Ensure pak is available for robust dependency resolution
          if (!requireNamespace("pak", quietly = TRUE))
            install.packages("pak")

          ## coloc is on CRAN; bigsnpr and LDheatmap may need special handling
          cran_pkgs <- c(
            "data.table", "coloc", "bigsnpr", "ggplot2", "ggrepel",
            "gridExtra", "grDevices", "pkgload", "testthat", "roxygen2",
            "knitr", "rmarkdown"
          )
          to_install <- cran_pkgs[!cran_pkgs %in% installed.packages()[, "Package"]]
          if (length(to_install) > 0)
            install.packages(to_install, dependencies = TRUE)

          ## LDheatmap is on GitHub (SFUStatgen/LDheatmap) if not on CRAN
          if (!requireNamespace("LDheatmap", quietly = TRUE)) {
            if (!requireNamespace("remotes", quietly = TRUE))
              install.packages("remotes")
            remotes::install_github("SFUStatgen/LDheatmap")
          }

      - name: Run tests
        shell: Rscript {0}
        run: |
          pkgload::load_all(".", quiet = TRUE)
          results <- testthat::test_local(".", reporter = "progress")
          if (any(as.data.frame(results)$failed > 0))
            stop("One or more tests failed.")

      - name: R CMD check
        shell: bash
        run: |
          export PATH="/usr/local/bin:$PATH"
          R CMD build . --no-manual
          R CMD check --no-manual *_*.tar.gz
